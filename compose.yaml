name: criteriabench

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://criteriabench:criteriabench@postgres:5432/criteriabench
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: mock
  ALLOW_PAID_CALLS: "false"
  OPENAI_MODEL: gpt-5.6-luna
  AUTO_CREATE_SCHEMA: "false"
  READINESS_REQUIRES_REDIS: "true"
  CRITERIABENCH_ENVIRONMENT: local
  CRITERIABENCH_LOG_LEVEL: INFO

x-app: &app
  build:
    context: .
    target: runtime
  image: criteriabench:local
  environment: *app-environment
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: criteriabench
      POSTGRES_USER: criteriabench
      POSTGRES_PASSWORD: criteriabench
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U criteriabench -d criteriabench"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]

  redis:
    image: redis:7.4.9-alpine
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data:size=256m,mode=0770
    networks: [backend]

  migrate:
    <<: *app
    command: [alembic, -c, migrations/alembic.ini, upgrade, head]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    networks: [backend, frontend]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6

  worker:
    <<: *app
    command: [python, -m, criteriabench.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/metrics', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks: [backend]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /prometheus:size=512m,mode=0770
    networks: [backend, frontend]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [backend, frontend]

volumes:
  postgres_data:
  grafana_data:

networks:
  backend:
    internal: true
  frontend: {}
