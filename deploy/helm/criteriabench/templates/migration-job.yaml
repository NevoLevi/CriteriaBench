apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "criteriabench.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "criteriabench.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "criteriabench.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "criteriabench.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "criteriabench.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 90); do
                if alembic -c migrations/alembic.ini current >/dev/null 2>&1; then
                  exec alembic -c migrations/alembic.ini upgrade head
                fi
                sleep 2
              done
              echo "database did not become reachable" >&2
              exit 1
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "criteriabench.databaseSecretName" . }}
                  key: {{ .Values.database.secretKey }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
