apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: criteriabench
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: criteriabench
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: criteriabench
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/nevolevi/criteriabench:0.1.0
          command: ["sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 90); do
                if alembic -c migrations/alembic.ini current >/dev/null 2>&1; then
                  exec alembic -c migrations/alembic.ini upgrade head
                fi
                sleep 2
              done
              echo "database did not become reachable" >&2
              exit 1
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: criteriabench-database
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
