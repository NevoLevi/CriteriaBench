name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  LLM_PROVIDER: mock
  ALLOW_PAID_CALLS: "false"
  COMPOSE_DISABLE_ENV_FILE: "1"
  COMPOSE_ENV_FILES: ""
  UV_NO_ENV_FILE: "1"
  UV_PYTHON_DOWNLOADS: never

jobs:
  test:
    name: Python quality and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.12-alpine
        env:
          POSTGRES_DB: criteriabench
          POSTGRES_USER: criteriabench
          POSTGRES_PASSWORD: criteriabench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U criteriabench -d criteriabench"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://criteriabench:criteriabench@127.0.0.1:5432/criteriabench
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify dependency lock
        run: uv lock --check
      - name: Install project from lock
        run: uv sync --frozen --extra dev
      - name: Ruff lint
        run: uv run --frozen --no-env-file ruff check .
      - name: Ruff formatting
        run: uv run --frozen --no-env-file ruff format --check .
      - name: Mypy
        run: uv run --frozen --no-env-file mypy src
      - name: Real PostgreSQL and Redis integrations
        run: uv run --frozen --no-env-file pytest -m integration
      - name: Mock-only unit and contract tests
        run: uv run --frozen --no-env-file pytest -m "not live and not integration" --cov=criteriabench --cov-report=term-missing --cov-report=xml --cov-fail-under=75
      - name: Frozen synthetic benchmark smoke
        run: >-
          uv run --frozen --no-env-file criteriabench-benchmark
          data/synthetic/benchmark_case_001.json
          --output artifacts/ci-benchmark-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Upload synthetic benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-benchmark-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
      - name: Reproduce synthetic v0.1.1 offline analysis
        run: >-
          uv run --frozen --no-env-file criteriabench-suite
          data/synthetic_v0_1/manifest.json
          --configs empty-v1 rules-v1
          --json-output artifacts/synthetic-v0.1.1.json
          --markdown-output artifacts/synthetic-v0.1.1.md
          --check-json docs/results/synthetic-v0.1.1.json
          --check-markdown docs/results/synthetic-v0.1.1.md
      - name: Upload synthetic v0.1.1 suite evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-v0.1.1-suite-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/synthetic-v0.1.1.*
          if-no-files-found: error
      - name: Reproduce frozen Real v1 evidence
        run: |
          uv run --frozen --no-env-file python -m criteriabench.real.llf_semantics \
            --records data/real/llf/records.jsonl \
            --agreement data/real/llf/agreement_annotations.jsonl \
            > artifacts/llf-semantic-coverage.json
          cmp artifacts/llf-semantic-coverage.json docs/results/llf-semantic-coverage.json
          uv run --frozen --no-env-file python -m criteriabench.real.llf_semantics \
            --split-reference data/real/llf/development_references.jsonl \
            --split development \
            > artifacts/llf-semantic-coverage-development.json
          cmp artifacts/llf-semantic-coverage-development.json docs/results/llf-semantic-coverage-development.json
          uv run --frozen --no-env-file python -m criteriabench.real.llf_semantics \
            --split-reference data/real/llf/test_references.jsonl \
            --split test \
            > artifacts/llf-semantic-coverage-test.json
          cmp artifacts/llf-semantic-coverage-test.json docs/results/llf-semantic-coverage-test.json
          uv run --frozen --no-env-file python -m criteriabench.real.llf_agreement \
            data/real/llf/agreement_annotations.jsonl \
            --output artifacts/llf-human-agreement.json
          cmp artifacts/llf-human-agreement.json docs/results/llf-human-agreement.json
          uv run --frozen --no-env-file criteriabench-llf-canary-preregister build \
            --dataset-dir data/real/llf \
            --coverage-dir docs/results \
            --output artifacts/llf-canary-preregistration.json
          cmp artifacts/llf-canary-preregistration.json docs/results/llf-canary-preregistration.json
      - name: Upload Real v1 LLF integrity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-v1-llf-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/llf-*.json
          if-no-files-found: error
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  infrastructure:
    name: Infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.2.4
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: v1.36.4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.0
      - name: Validate Compose without dotenv discovery
        shell: pwsh
        run: ./scripts/compose-safe.ps1 config --quiet
      - name: Lint and render Helm chart
        run: |
          helm lint deploy/helm/criteriabench --strict
          helm template criteriabench deploy/helm/criteriabench --namespace criteriabench > /tmp/criteriabench-rendered.yaml
      - name: Render Kustomize overlay
        run: kubectl kustomize deploy/k8s/overlays/kind > /tmp/criteriabench-kind.yaml
      - name: Validate Terraform
        working-directory: infra/azure
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  container:
    name: Container build and vulnerability scan
    needs: [test, infrastructure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local scan image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: criteriabench:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: criteriabench:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload scan to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3 reviewed 2026-09-01
        with:
          sarif_file: trivy-results.sarif
